---
layout: null
title: "Writing"
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Writing — S. M. Iqbal Mahamud</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Plus Jakarta Sans", sans-serif; background: #f5f6fa; color: #1a1a2e; }

nav { position: fixed; top: 0; left: 0; right: 0; height: 68px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 52px; border-bottom: 1px solid #ebebeb; z-index: 999; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
.nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-circle { width: 38px; height: 38px; border-radius: 50%; background: #7C3AED; color: #fff; font-weight: 800; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.nav-name { font-weight: 800; font-size: 1rem; color: #1a1a2e; }
.nav-links { display: flex; align-items: center; gap: 24px; list-style: none; }
.nav-links a { color: #555; text-decoration: none; font-size: 0.88rem; font-weight: 500; transition: color .2s; }
.nav-links a:hover, .nav-links a.active { color: #7C3AED; }
.nav-cta { background: #7C3AED; color: #fff !important; padding: 9px 20px; border-radius: 7px; font-weight: 600 !important; white-space: nowrap; }
.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; background: none; border: none; }
.hamburger span { display: block; width: 24px; height: 2px; background: #1a1a2e; border-radius: 2px; }
.mobile-menu { display: none; position: fixed; top: 68px; left: 0; right: 0; background: #fff; border-bottom: 1px solid #e5e7eb; padding: 16px 24px; flex-direction: column; gap: 4px; z-index: 998; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
.mobile-menu.open { display: flex; }
.mobile-menu a { color: #374151; text-decoration: none; font-size: 0.95rem; font-weight: 500; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
.mobile-menu a:last-child { border-bottom: none; color: #7C3AED; font-weight: 700; }

.page { padding-top: 68px; }

/* PAGE TABS */
.page-tabs { background: #fff; border-bottom: 2px solid #f0f0f0; padding: 0 52px; display: flex; overflow-x: auto; }
.page-tab { padding: 18px 24px; font-size: 0.9rem; font-weight: 600; color: #6b7280; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color .2s, border-color .2s; text-decoration: none; display: block; white-space: nowrap; }
.page-tab:hover { color: #7C3AED; }
.page-tab.active { color: #7C3AED; border-bottom-color: #7C3AED; }

.subpage { display: none; }
.subpage.active { display: block; }

/* WRITING CONTENT */
.writing-content { max-width: 1100px; margin: 0 auto; padding: 40px; }
.subpage-content { max-width: 900px; margin: 0 auto; padding: 40px; }

/* FEATURED ROW */
.featured-row { display: grid; grid-template-columns: 1fr 380px; gap: 24px; margin-bottom: 48px; }
.featured-main { position: relative; border-radius: 16px; overflow: hidden; cursor: pointer; min-height: 340px; background: #1a1a2e; }
.featured-main-bg { position: absolute; inset: 0; background: linear-gradient(135deg, #1a1a2e, #2d1b69, #7C3AED); display: flex; align-items: center; justify-content: center; font-size: 5rem; }
.featured-main-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 60%, transparent 100%); }
.featured-main-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 28px; }
.featured-cat { display: inline-block; background: #7C3AED; color: white; font-size: 0.72rem; font-weight: 700; padding: 4px 12px; border-radius: 100px; margin-bottom: 10px; }
.featured-main-content h3 { font-size: 1.5rem; font-weight: 800; color: white; line-height: 1.3; }
.featured-main-content .feat-date { font-size: 0.75rem; color: rgba(255,255,255,0.6); margin-top: 8px; }
.featured-others { display: flex; flex-direction: column; }
.featured-others-title { font-size: 0.82rem; font-weight: 800; color: #12122a; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.other-post { display: flex; gap: 14px; align-items: center; padding: 10px 8px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background .15s; border-radius: 8px; }
.other-post:last-child { border-bottom: none; }
.other-post:hover { background: #f5f3ff; }
.other-post-thumb { width: 72px; height: 56px; border-radius: 8px; background: linear-gradient(135deg, #e0d7ff, #c4b5fd); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
.other-post-title { font-size: 0.85rem; font-weight: 600; color: #1a1a2e; line-height: 1.4; }
.other-post-cat { font-size: 0.7rem; color: #9ca3af; margin-top: 2px; }
.recent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; margin-top: 8px; }
.recent-header h3 { font-size: 1.2rem; font-weight: 800; color: #12122a; }
.recent-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.recent-card { background: white; border-radius: 14px; overflow: hidden; cursor: pointer; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1px solid #f0f0f0; transition: transform .2s, box-shadow .2s; }
.recent-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(124,58,237,0.1); }
.recent-card-img { height: 160px; background: linear-gradient(135deg, #f0ebff, #ddd6fe); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
.recent-card-body { padding: 16px; }
.recent-cat-tag { font-size: 0.68rem; font-weight: 700; color: #7C3AED; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
.recent-card-title { font-size: 0.9rem; font-weight: 700; color: #12122a; line-height: 1.4; margin-bottom: 5px; }
.recent-card-date { font-size: 0.7rem; color: #9ca3af; }
.empty-state { text-align: center; padding: 80px 20px; color: #9ca3af; }
.empty-icon { font-size: 4rem; margin-bottom: 16px; }

/* POEM LIST TABLE */
.poem-header { font-size: 1.4rem; font-weight: 800; color: #12122a; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
.poem-table { width: 100%; background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1px solid #f0f0f0; overflow: hidden; }
.poem-table-head { display: grid; grid-template-columns: 180px 1fr 80px; background: #f5f3ff; padding: 14px 24px; font-size: 0.75rem; font-weight: 800; color: #7C3AED; text-transform: uppercase; letter-spacing: 0.08em; }
.poem-row { display: grid; grid-template-columns: 180px 1fr 80px; padding: 16px 24px; border-top: 1px solid #f5f5f5; align-items: center; cursor: pointer; transition: background .15s; }
.poem-row:hover { background: #faf9ff; }
.poem-row:hover .poem-name { color: #7C3AED; text-decoration: underline; }
.poem-date-col { font-size: 0.82rem; color: #6b7280; font-weight: 500; }
.poem-name { font-size: 0.95rem; font-weight: 700; color: #1a1a2e; transition: color .2s; }
.poem-comment-count { font-size: 0.8rem; color: #9ca3af; display: flex; align-items: center; gap: 4px; }

/* SUBPAGE LIST for story/bangla */
.sub-section-title { font-size: 1.4rem; font-weight: 800; color: #12122a; margin-bottom: 24px; }
.sub-posts-list { display: flex; flex-direction: column; gap: 16px; }
.sub-post-card { background: white; border-radius: 14px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; cursor: pointer; transition: transform .2s, box-shadow .2s; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.sub-post-card:hover { transform: translateX(6px); box-shadow: 0 8px 24px rgba(124,58,237,0.1); border-color: #e0d7ff; }
.sub-post-tag { font-size: 0.68rem; font-weight: 700; color: #7C3AED; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
.sub-post-title { font-size: 1rem; font-weight: 700; color: #12122a; margin-bottom: 5px; }
.sub-post-excerpt { font-size: 0.82rem; color: #6b7280; line-height: 1.6; }
.sub-post-date { font-size: 0.7rem; color: #9ca3af; white-space: nowrap; flex-shrink: 0; }

/* READ MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 9999; display: none; align-items: flex-start; justify-content: center; padding: 80px 20px 40px; overflow-y: auto; }
.modal-overlay.open { display: flex; }
.modal-box { background: white; border-radius: 20px; width: 100%; max-width: 740px; padding: 48px; box-shadow: 0 24px 60px rgba(0,0,0,0.2); position: relative; margin-bottom: 40px; }
.modal-close { position: absolute; top: 20px; right: 20px; background: #f3f4f6; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
.modal-cat-label { font-size: 0.72rem; font-weight: 700; color: #7C3AED; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; display: block; }
.modal-title { font-size: 1.9rem; font-weight: 800; color: #12122a; margin-bottom: 4px; line-height: 1.3; }
.modal-author { font-size: 0.85rem; color: #7C3AED; font-weight: 600; margin-bottom: 6px; }
.modal-date { font-size: 0.78rem; color: #9ca3af; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid #f0f0f0; }
.modal-body { font-size: 1rem; color: #374151; line-height: 2.1; white-space: pre-wrap; font-family: "Plus Jakarta Sans", sans-serif; }

/* COMMENTS */
.comments-section { margin-top: 36px; padding-top: 28px; border-top: 1px solid #f0f0f0; }
.comments-title { font-size: 1rem; font-weight: 800; color: #12122a; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
.comment-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
.comment-item { background: #f9f8ff; border-radius: 12px; padding: 14px 16px; border: 1px solid #ede9fe; }
.comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.comment-name { font-size: 0.85rem; font-weight: 700; color: #1a1a2e; }
.comment-time { font-size: 0.72rem; color: #9ca3af; }
.comment-text { font-size: 0.88rem; color: #374151; line-height: 1.6; }
.no-comments { font-size: 0.85rem; color: #9ca3af; text-align: center; padding: 20px; }
.comment-form { display: flex; flex-direction: column; gap: 10px; }
.comment-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.comment-input { padding: 10px 14px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-family: inherit; font-size: 0.88rem; outline: none; transition: border-color .2s; }
.comment-input:focus { border-color: #7C3AED; }
.comment-textarea { padding: 10px 14px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-family: inherit; font-size: 0.88rem; outline: none; resize: vertical; min-height: 80px; transition: border-color .2s; }
.comment-textarea:focus { border-color: #7C3AED; }
.comment-submit { background: #7C3AED; color: white; padding: 10px 24px; border-radius: 8px; font-weight: 700; font-size: 0.88rem; border: none; cursor: pointer; align-self: flex-end; transition: background .2s; }
.comment-submit:hover { background: #6D28D9; }

/* RESPONSIVE */
@media (max-width: 1024px) {
  .featured-row { grid-template-columns: 1fr; }
  .featured-others { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .featured-others-title { grid-column: 1/-1; }
  .recent-grid { grid-template-columns: 1fr 1fr; }
  .page-tabs { padding: 0 24px; }
  .writing-content, .subpage-content { padding: 32px 24px; }
}
@media (max-width: 768px) {
  nav { padding: 0 16px; }
  .nav-links { display: none; }
  .hamburger { display: flex; }
  .page-tabs { padding: 0 12px; }
  .page-tab { padding: 14px 14px; font-size: 0.8rem; }
  .writing-content, .subpage-content { padding: 24px 16px; }
  .featured-row { grid-template-columns: 1fr; }
  .featured-main { min-height: 220px; }
  .featured-others { display: flex; flex-direction: column; }
  .recent-grid { grid-template-columns: 1fr; }
  .modal-box { padding: 24px 16px; }
  .modal-title { font-size: 1.4rem; }
  .poem-table-head, .poem-row { grid-template-columns: 130px 1fr 60px; padding: 12px 14px; }
  .comment-form-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
{% include nav.html %}
<div class="page">
  <div class="page-tabs">
    <a class="page-tab active" onclick="return showTab('english',this)">✍️ Articles</a>
    <a class="page-tab" onclick="return showTab('poem',this)">📜 Poem</a>
    <a class="page-tab" onclick="return showTab('story',this)">📖 Short Story</a>
    <a class="page-tab" onclick="return showTab('bangla',this)">🇧🇩 Bangla Article</a>
  </div>

  <!-- ENGLISH -->
  <div class="subpage active" id="tab-english">
    <div class="writing-content" id="englishContent"></div>
  </div>

  <!-- POEM -->
  <div class="subpage" id="tab-poem">
    <div class="subpage-content">
      <div class="poem-header">📜 কবিতা</div>
      <div class="poem-table">
        <div class="poem-table-head">
          <div>তারিখ</div><div>শিরোনাম</div><div>মন্তব্য</div>
        </div>
        <div id="poemTableBody"></div>
      </div>
    </div>
  </div>

  <!-- SHORT STORY -->
  <div class="subpage" id="tab-story">
    <div class="subpage-content">
      <div class="empty-state"><div class="empty-icon">📖</div><p>No stories published yet. Check back soon!</p></div>
    </div>
  </div>

  <!-- BANGLA -->
  <div class="subpage" id="tab-bangla">
    <div class="subpage-content">
      <div class="empty-state"><div class="empty-icon">🇧🇩</div><p>এখনো কোনো আর্টিকেল প্রকাশিত হয়নি।</p></div>
    </div>
  </div>
</div>

<!-- READ MODAL -->
<div class="modal-overlay" id="readModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeRead()">✕</button>
    <div id="readContent"></div>
    <div class="comments-section">
      <div class="comments-title">💬 মন্তব্য <span id="commentCount" style="color:#9ca3af;font-weight:500;font-size:0.85rem"></span></div>
      <div class="comment-list" id="commentList"></div>
      <div class="comment-form">
        <div class="comment-form-row">
          <input class="comment-input" id="commentName" placeholder="আপনার নাম *"/>
          <input class="comment-input" id="commentEmail" placeholder="ইমেইল (ঐচ্ছিক)"/>
        </div>
        <textarea class="comment-textarea" id="commentText" placeholder="আপনার মন্তব্য লিখুন..."></textarea>
        <button class="comment-submit" onclick="submitComment()">মন্তব্য করুন →</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── DATA (from Jekyll _data files, edited via the admin panel) ──
var POEMS = [
{% for p in site.data.poems.poems %}  { title: {{ p.title | jsonify }}, date: {{ p.date | jsonify }}, body: {{ p.body | jsonify }} },
{% endfor %}];

var POSTS = {
  english: [
{% for a in site.data.articles.articles %}    { title: {{ a.title | jsonify }}, cat: {{ a.cat | jsonify }}, date: {{ a.date | jsonify }}, img: {{ a.img | jsonify }}, body: {{ a.body | jsonify }} },
{% endfor %}  ],
  poem: POEMS,
  story: [],
  bangla: []
};
var currentPoemIdx = 0;

// ── RENDER (unchanged from original site logic) ──
function showTab(tab, el) {
  document.querySelectorAll('.subpage').forEach(function(s){ s.classList.remove('active'); });
  document.querySelectorAll('.page-tab').forEach(function(t){ t.classList.remove('active'); });
  document.getElementById('tab-' + tab).classList.add('active');
  el.classList.add('active');
  return false;
}

function renderEnglish() {
  var posts = POSTS.english;
  var el = document.getElementById('englishContent');
  if (posts.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">✍️</div><p>No articles published yet.<br/>Check back soon!</p></div>';
    return;
  }
  var main = posts[0];
  var others = posts.slice(1, 6);
  var recent = posts.slice(1);

  var mainBg = main.img
    ? '<img src="' + main.img + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.7;display:block;"/>'
    : '<div class="featured-main-bg">🔬</div>';

  var othersHtml = '';
  if (others.length > 0) {
    othersHtml = '<div class="featured-others"><div class="featured-others-title">Other featured posts</div>' +
      others.map(function(p, i) {
        var thumb = p.img
          ? '<img src="' + p.img + '" style="width:100%;height:100%;object-fit:cover;border-radius:8px;"/>'
          : '✍️';
        return '<div class="other-post" onclick="readArticle(' + (i+1) + ')">' +
          '<div class="other-post-thumb">' + thumb + '</div>' +
          '<div><div class="other-post-title">' + p.title + '</div><div class="other-post-cat">' + p.cat + '</div></div></div>';
      }).join('') + '</div>';
  }

  var recentHtml = '';
  if (recent.length > 0) {
    recentHtml = '<div class="recent-header"><h3>Recent Posts</h3></div>' +
      '<div class="recent-grid">' +
      recent.slice(0,6).map(function(p, i) {
        var cardImg = p.img
          ? '<img src="' + p.img + '" style="width:100%;height:100%;object-fit:cover;"/>'
          : '🔬';
        return '<div class="recent-card" onclick="readArticle(' + (i+1) + ')">' +
          '<div class="recent-card-img">' + cardImg + '</div>' +
          '<div class="recent-card-body">' +
            '<div class="recent-cat-tag">' + p.cat + '</div>' +
            '<div class="recent-card-title">' + p.title + '</div>' +
            '<div class="recent-card-date">' + p.date + '</div>' +
          '</div></div>';
      }).join('') + '</div>';
  }

  el.innerHTML =
    '<div class="featured-row">' +
      '<div class="featured-main" onclick="readArticle(0)">' +
        mainBg +
        '<div class="featured-main-overlay"></div>' +
        '<div class="featured-main-content">' +
          '<span class="featured-cat">' + main.cat + '</span>' +
          '<h3>' + main.title + '</h3>' +
          '<div class="feat-date">' + main.date + '</div>' +
        '</div></div>' +
      othersHtml +
    '</div>' + recentHtml;
}

function readArticle(idx) {
  var p = POSTS.english[idx];
  document.getElementById('readContent').innerHTML =
    '<span class="modal-cat-label">' + p.cat + '</span>' +
    (p.img ? '<img src="' + p.img + '" style="width:100%;border-radius:12px;margin-bottom:20px;max-height:320px;object-fit:cover;"/>' : '') +
    '<div class="modal-title">' + p.title + '</div>' +
    '<div class="modal-author" style="font-size:0.85rem;color:#7C3AED;font-weight:600;margin-bottom:4px;">Iqbal Mahamud</div>' +
    '<div class="modal-date">' + p.date + '</div>' +
    '<div class="modal-body">' + p.body + '</div>';
  document.querySelector('.comments-section').style.display = 'none';
  document.getElementById('readModal').classList.add('open');
  document.getElementById('readModal').scrollTop = 0;
}

function getComments(poemIdx) {
  return JSON.parse(localStorage.getItem('poem_comments_' + poemIdx) || '[]');
}
function saveComments(poemIdx, comments) {
  localStorage.setItem('poem_comments_' + poemIdx, JSON.stringify(comments));
}

function renderPoemTable() {
  var tbody = document.getElementById('poemTableBody');
  tbody.innerHTML = POEMS.map(function(p, i) {
    var comments = getComments(i);
    return '<div class="poem-row" onclick="openPoem(' + i + ')">' +
      '<div class="poem-date-col">' + p.date + '</div>' +
      '<div class="poem-name">' + p.title + '</div>' +
      '<div class="poem-comment-count">💬 ' + comments.length + '</div>' +
    '</div>';
  }).join('');
}

function openPoem(idx) {
  document.querySelector('.comments-section').style.display = 'block';
  currentPoemIdx = idx;
  var p = POEMS[idx];
  document.getElementById('readContent').innerHTML =
    '<span class="modal-cat-label">📜 কবিতা</span>' +
    '<div class="modal-title">' + p.title + '</div>' +
    '<div class="modal-date">' + p.date + '</div>' +
    '<div class="modal-body">' + p.body + '</div>';
  renderComments(idx);
  document.getElementById('readModal').classList.add('open');
  document.getElementById('readModal').scrollTop = 0;
}

function renderComments(idx) {
  var comments = getComments(idx);
  var list = document.getElementById('commentList');
  document.getElementById('commentCount').textContent = '(' + comments.length + ')';
  if (comments.length === 0) {
    list.innerHTML = '<div class="no-comments">এখনো কোনো মন্তব্য নেই। প্রথম মন্তব্য করুন!</div>';
  } else {
    list.innerHTML = comments.map(function(c) {
      return '<div class="comment-item">' +
        '<div class="comment-header"><span class="comment-name">👤 ' + c.name + '</span><span class="comment-time">' + c.time + '</span></div>' +
        '<div class="comment-text">' + c.text + '</div>' +
      '</div>';
    }).join('');
  }
}

function submitComment() {
  var name = document.getElementById('commentName').value.trim();
  var text = document.getElementById('commentText').value.trim();
  if (!name || !text) { alert('নাম এবং মন্তব্য লিখুন।'); return; }
  var comments = getComments(currentPoemIdx);
  var now = new Date();
  var time = now.toLocaleDateString('bn-BD') + ' ' + now.toLocaleTimeString('bn-BD', {hour:'2-digit', minute:'2-digit'});
  comments.push({ name: name, text: text, time: time });
  saveComments(currentPoemIdx, comments);
  document.getElementById('commentName').value = '';
  document.getElementById('commentEmail').value = '';
  document.getElementById('commentText').value = '';
  renderComments(currentPoemIdx);
  renderPoemTable();
}

function closeRead() {
  document.getElementById('readModal').classList.remove('open');
}

document.addEventListener('click', function(e) {
  var menu = document.getElementById('mobileMenu');
  var btn = document.querySelector('.hamburger');
  if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) menu.classList.remove('open');
  if (e.target === document.getElementById('readModal')) closeRead();
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeRead(); });

renderEnglish();
renderPoemTable();
</script>
</body>
</html>
